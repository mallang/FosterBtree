[package]
name = "fbtree"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = ["256k_page"]
log_trace = []
log_debug = []
log_info = []
log_warn = []
log_error = []
stat = []

# Page sizes. If page sizes are larger than 256k, pages will be heap allocated to avoid stack overflow.
# Default is 16KB (defined in page.rs)
test_page = []
4k_page = []
8k_page = []
16k_page = []
32k_page = []
64k_page = []
128k_page = []
256k_page = ["heap_allocated_page"]
512k_page = ["heap_allocated_page"]
1m_page = ["heap_allocated_page"]
heap_allocated_page = []

# YCSB workloads
ycsb_fbt = []
ycsb_hash_fbt = []
ycsb_hash_chain = []
ycsb_hash_bloom_chain = []

# Hints
no_tree_hint = []
no_bp_hint = []

# Old iterator for foster btree
old_iter = []
# Async IO only for write
async_write = ["io-uring", "libc"]
# Async IO with prefetching
new_async_write = ["io-uring", "libc"]


[dependencies]
tempfile = "3.8"
rand = { version = "0.8.5", features = ["small_rng"] }
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
lazy_static = { version = "1.4" }
clap = {version = "4.5", features = ["derive"]}
concurrent-queue = "2.5"
io-uring = {version = "0.7", optional = true}
libc = {version = "0.2", optional = true}
zipf = "7.0.1"
fastbloom = "0.7"
csv = "1.1.6"
lock_api = {version = "0.4.12", features = ["arc_lock"]} 
memchr = "2.7.4"
dashmap = "6.1"
rpmalloc = "0.2.0"
farmhash = "1"
anyhow = "1"
regex = "1.5"
parking_lot = {version = "0.12.3", features = ["send_guard"]}
num-format = "0.4"
memoffset = { version = "0.9", features = ["unstable_const"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"]}
serde_cbor = "0.11"
rstest = "0.23"

# For wasm (uncomment to use)
# [lib]
# crate-type = ["cdylib", "rlib"]
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
debug = true # For perf

[[bench]]
name = "foster_btree_insert"
harness = false

[[bench]]
name = "hash_index_insert"
harness = false

[[bin]]
name = "hash_join_bench"
path = "benches/hash_join/bench_ops_workload/hash_join_bench.rs"

[[bin]]
name = "hash_join_bench_mixed_get"
path = "benches/hash_join/get_multiversion/hash_join_bench_mixed_get.rs"

[[bin]]
name = "join_simulation"
path = "benches/hash_join/join_simulation/join_simulation.rs"

[[bin]]
name = "hash_join_bench_mixed_get_repair"
path = "benches/hash_join/get_multiversion/hash_join_bench_mixed_get_repair.rs"

[[bin]]
name = "join_simulation_repair"
path = "benches/hash_join/bench_join_simulation_repair/join_simulation_repair.rs"


[[bin]]
name = "join_repair"
path = "benches/hash_join/join_simulation/join_repair.rs"